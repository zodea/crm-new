<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563c7"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7b8794"/>
    </marker>
    <style>
      .page { fill: #f6f8fb; }
      .board { fill: #fff; stroke: #e2e8f0; stroke-width: 1.5; }
      .title { font: 700 30px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #171717; }
      .subtitle { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #687385; }
      .zone { fill: #fff; stroke: #94b8f0; stroke-width: 2; stroke-dasharray: 9 7; }
      .zoneTitle { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2359b6; letter-spacing: .3px; }
      .cardTitle { font: 700 21px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .cardSub { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #667085; }
      .small { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #667085; }
      .panelTitle { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .metric { font: 400 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4b5563; }
      .blueText { font: 500 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2563c7; }
      .legendText { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4b5563; }
      .tag { font: 600 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2563c7; }
      .badgeText { font: 700 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #fff; }
      .blueCard { fill: #eef5ff; stroke: #2563c7; stroke-width: 2.5; }
      .orangeCard { fill: #fff7e6; stroke: #ff7a00; stroke-width: 2.5; }
      .greenCard { fill: #eaf7ed; stroke: #2b8a3e; stroke-width: 2.5; }
      .grayCard { fill: #eeeeee; stroke: #7b7b7b; stroke-width: 2.5; }
      .strip { fill: #f8fafc; stroke: #d8dee8; stroke-width: 1.4; }
      .routeTag { fill: #fff; stroke: #c7d7f7; stroke-width: 1.2; }
      .arrowBlue { stroke: #2563c7; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowGray { stroke: #7b8794; stroke-width: 3; fill: none; marker-end: url(#arrowGray); }
      .dashGray { stroke: #8f99a7; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowGray); }
    </style>
  </defs>

  <rect class="page" width="1600" height="900"/>
  <rect class="board" x="20" y="20" width="1560" height="860" rx="16" filter="url(#softShadow)"/>

  <text class="title" x="800" y="62" text-anchor="middle">分供方模块 — 业务流程</text>
  <text class="subtitle" x="800" y="92" text-anchor="middle">按图二架构：基础信息独立，项目业务通过关联入口进入各自模块</text>

  <rect class="zone" x="48" y="115" width="1504" height="295" rx="18"/>
  <text class="zoneTitle" x="82" y="153">ZONE 1 · 基础信息 /base/supplier</text>

  <rect class="blueCard" x="82" y="178" width="238" height="92" rx="13"/>
  <text class="cardTitle" x="201" y="214" text-anchor="middle">① 新增分供方</text>
  <text class="cardSub" x="201" y="243" text-anchor="middle">手动 / 发票收集 / Excel</text>

  <path class="arrowBlue" d="M320 224 L385 224"/>
  <circle cx="358" cy="224" r="13" fill="#ff7a00"/>
  <text class="badgeText" x="358" y="229" text-anchor="middle">审</text>

  <rect class="blueCard" x="395" y="178" width="238" height="92" rx="13"/>
  <text class="cardTitle" x="514" y="214" text-anchor="middle">② 证照管理</text>
  <text class="cardSub" x="514" y="243" text-anchor="middle">上传 → OCR识别 → 回填</text>

  <path class="arrowBlue" d="M633 224 L698 224"/>

  <rect class="orangeCard" x="708" y="178" width="238" height="92" rx="13"/>
  <text class="cardTitle" x="827" y="214" text-anchor="middle">③ 资料审核</text>
  <text class="cardSub" x="827" y="243" text-anchor="middle">确认资料完整</text>

  <path class="arrowBlue" d="M946 224 L1011 224"/>
  <circle cx="984" cy="224" r="13" fill="#2b8a3e"/>
  <text class="badgeText" x="984" y="229" text-anchor="middle">审</text>

  <rect class="greenCard" x="1021" y="178" width="238" height="92" rx="13"/>
  <text class="cardTitle" x="1140" y="214" text-anchor="middle">④ 合格入库</text>
  <text class="cardSub" x="1140" y="243" text-anchor="middle">可关联项目</text>

  <path class="dashGray" d="M827 270 L827 304 L514 304 L514 272"/>
  <text class="small" x="670" y="322" text-anchor="middle">退回补充</text>

  <rect class="strip" x="82" y="337" width="1177" height="42" rx="10"/>
  <text class="small" x="105" y="363">证照清单：营业执照 · 法人身份证 · 银行开户许可证 · 签约代表身份证 · 品牌授权证明 · 合同模板</text>

  <rect class="routeTag" x="1310" y="292" width="165" height="87" rx="12"/>
  <text class="blueText" x="1392" y="324" text-anchor="middle">资料状态</text>
  <text class="tag" x="1392" y="352" text-anchor="middle">齐 / 缺 / 审核中</text>

  <path class="arrowBlue" d="M1140 270 L1140 439"/>
  <text class="blueText" x="1172" y="382">关联到项目</text>

  <rect class="zone" x="48" y="430" width="1504" height="337" rx="18"/>
  <text class="zoneTitle" x="82" y="468">ZONE 2 · 项目 × 分供方（项目详情 tabs / 独立业务入口）</text>

  <rect class="blueCard" x="82" y="495" width="235" height="94" rx="13"/>
  <text class="cardTitle" x="199" y="528" text-anchor="middle">⑤ 合同签订</text>
  <text class="cardSub" x="199" y="556" text-anchor="middle">金额 / 日期 / 扫描件</text>
  <rect class="routeTag" x="128" y="566" width="142" height="20" rx="6"/>
  <text class="tag" x="199" y="581" text-anchor="middle">/material/contract</text>

  <path class="arrowGray" d="M317 542 L386 542"/>

  <rect class="orangeCard" x="396" y="495" width="235" height="94" rx="13"/>
  <text class="cardTitle" x="514" y="528" text-anchor="middle">⑥ 请款申请</text>
  <text class="cardSub" x="514" y="556" text-anchor="middle">送货单 / 发票 / 审批</text>
  <rect class="routeTag" x="452" y="566" width="124" height="20" rx="6"/>
  <text class="tag" x="514" y="581" text-anchor="middle">/finance/payment</text>
  <circle cx="358" cy="542" r="13" fill="#ff7a00"/>
  <text class="badgeText" x="358" y="547" text-anchor="middle">审</text>

  <path class="arrowGray" d="M631 542 L700 542"/>

  <rect class="greenCard" x="710" y="495" width="235" height="94" rx="13"/>
  <text class="cardTitle" x="827" y="528" text-anchor="middle">⑦ 收票 / 付款</text>
  <text class="cardSub" x="827" y="556" text-anchor="middle">收票登记 / 付款记录</text>
  <rect class="routeTag" x="764" y="566" width="126" height="20" rx="6"/>
  <text class="tag" x="827" y="581" text-anchor="middle">/finance/ticket</text>
  <circle cx="672" cy="542" r="13" fill="#2b8a3e"/>
  <text class="badgeText" x="672" y="547" text-anchor="middle">审</text>

  <path class="arrowGray" d="M945 542 L1014 542"/>

  <rect class="grayCard" x="1024" y="495" width="235" height="94" rx="13"/>
  <text class="cardTitle" x="1142" y="528" text-anchor="middle">⑧ 最终结算</text>
  <text class="cardSub" x="1142" y="556" text-anchor="middle">结算金额 / PDF / 只读</text>
  <rect class="routeTag" x="1086" y="566" width="112" height="20" rx="6"/>
  <text class="tag" x="1142" y="581" text-anchor="middle">project tabs</text>

  <path class="dashGray" d="M827 589 L827 626 L514 626 L514 591"/>
  <text class="small" x="670" y="648" text-anchor="middle">多轮请款 / 分阶段施工</text>

  <rect class="strip" x="82" y="668" width="1177" height="71" rx="12"/>
  <text class="panelTitle" x="106" y="696">实时计算 → 项目经营数据面板</text>
  <text class="metric" x="106" y="724">累计请款额 = Σ 已批准请款　　累计已付 = Σ 付款流水　　合同余额 = 合同额 - 已付</text>
  <text class="metric" x="106" y="748">收票总额 = Σ 发票金额　　　结算尾款 = 结算额 - 已付　　税差 = 收票 - 应收</text>
  <text class="blueText" x="1086" y="724">↑ 汇入首页 Dashboard</text>

  <rect class="strip" x="1290" y="668" width="185" height="71" rx="12"/>
  <text class="panelTitle" x="1382" y="700" text-anchor="middle">分供方页只读</text>
  <text class="small" x="1382" y="727" text-anchor="middle">点击跳转对应模块</text>

  <rect class="strip" x="48" y="792" width="1504" height="60" rx="12"/>
  <text class="panelTitle" x="82" y="828">图例</text>
  <rect class="blueCard" x="150" y="811" width="42" height="24" rx="6"/>
  <text class="legendText" x="202" y="829">进行中</text>
  <rect class="orangeCard" x="302" y="811" width="42" height="24" rx="6"/>
  <text class="legendText" x="354" y="829">待审核</text>
  <rect class="greenCard" x="454" y="811" width="42" height="24" rx="6"/>
  <text class="legendText" x="506" y="829">已通过</text>
  <rect class="grayCard" x="606" y="811" width="42" height="24" rx="6"/>
  <text class="legendText" x="658" y="829">终态只读</text>
  <line x1="774" y1="823" x2="842" y2="823" stroke="#8f99a7" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text class="legendText" x="858" y="829">退回 / 循环</text>
  <text class="small" x="1492" y="829" text-anchor="end">Supplier 主数据共享；ProjectSupplier 承接项目维度业务</text>
</svg>
