name: CI

on:
  workflow_dispatch:
    inputs:
      run_quality:
        description: Run lint, typecheck, unit/component tests, and static generation
        required: true
        default: true
        type: boolean
      run_e2e:
        description: Run Playwright behavior tests once for a merged PR batch
        required: true
        default: false
        type: boolean
      run_production_acceptance:
        description: Build and run isolated production acceptance tests
        required: true
        default: false
        type: boolean
      run_visual:
        description: Run Windows visual regression once for a merged PR batch
        required: true
        default: false
        type: boolean
      base_sha:
        description: Previous validated batch SHA used as lint diff base; defaults to HEAD^
        required: false
        type: string
      e2e_targets:
        description: Optional space-separated Playwright files; empty runs all E2E tests
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: quality
    if: ${{ inputs.run_quality }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed code
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.js|*.mjs|*.cjs|*.ts|*.mts|*.cts|*.vue)
                files+=("$file")
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" HEAD)

          if ((${#files[@]} == 0)); then
            echo "No changed JavaScript, TypeScript, or Vue files to lint."
            exit 0
          fi

          pnpm exec eslint "${files[@]}"

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generate static frontend
        run: pnpm generate

  e2e:
    name: e2e
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF diagnostics
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        shell: bash
        env:
          E2E_TARGETS: ${{ inputs.e2e_targets }}
        run: |
          if [[ -z "$E2E_TARGETS" ]]; then
            pnpm exec playwright test --project=chromium --project=chromium-b
            exit 0
          fi

          read -r -a targets <<< "$E2E_TARGETS"
          pnpm exec playwright test --project=chromium --project=chromium-b "${targets[@]}"

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  production-acceptance:
    name: production-acceptance
    if: ${{ inputs.run_production_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build production application
        run: pnpm build
      - name: Run production acceptance
        env:
          CRM_PRODUCTION_ACCEPTANCE: '1'
        run: pnpm exec playwright test --project=production --forbid-only '--reporter=list,github'
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: production-acceptance-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    if: ${{ inputs.run_visual }}
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Visual and interaction regression
        run: pnpm test:visual

      - name: Upload visual diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-test-results
          path: test-results/visual/
          if-no-files-found: ignore
          retention-days: 7
