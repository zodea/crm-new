      --danger: #E04E5C; --danger-soft: rgb(253 219 224); --danger-ink: #9D313E;

    .dc-tabbar { position: sticky; top: 64px; z-index: 19; height: 40px; flex: none;

      display: flex; align-items: stretch; gap: 2px; padding: 0 16px;
      overflow-x: auto; overflow-y: hidden; }
    .dc-tabbar::-webkit-scrollbar { height: 0; }
    .dc-tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;

    .dc-tab.active { background: var(--panel); color: var(--brand); font-weight: 800;

    .dc-tab.active:hover { color: var(--brand-deep); }
    .dc-tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dc-tab-x { display: grid; place-items: center; width: 16px; height: 16px; flex: none;
      border: 0; border-radius: 4px; background: transparent; padding: 0;
      color: var(--ink-soft); font-size: 13px; line-height: 1; cursor: pointer; }
    .dc-tab-x:hover { background: var(--danger-soft); color: var(--danger-ink); }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script>

const PAGE = {
  home:          { title: "首页",     subtitle: "在建工程总览" },
  project:       { title: "施工项目",  subtitle: "项目管理" },
  projectDetail: { title: "项目详情",  subtitle: "经营驾驶舱 · 阶段 · 子表" },
  schedule:      { title: "施工进度",  subtitle: "WBS 排程 · 计划vs实际 · 依赖 · 调期" },
  scheduleGroupNew: { title: "新建楼栋分组", subtitle: "工序模板逐条可调 · 排程实时预览" },
  supplier:      { title: "分供方资料库", subtitle: "资料管理 · 对账" },
  supplierDetail:{ title: "分供方详情", subtitle: "资料 · 证照 · 跨项目汇总" },
  crew:          { title: "班组管理",  subtitle: "全局核算单元 · 跨项目复用" },
  crewDetail:    { title: "班组详情",  subtitle: "基本信息 · 工人配置 · 分项单价" },
  worker:        { title: "工人信息库", subtitle: "人员管理" },
  workerDetail:  { title: "工人详情", subtitle: "档案 · 证书 · 亲属关联" },
  invoice:       { title: "发票识别",  subtitle: "识别中心 · 上传 · 校对 · 打印排版" },
  invoiceLedger: { title: "发票台账",  subtitle: "资金管理 · 列表 / 打印 / 修改" },
  invoiceEdit:   { title: "发票编辑",  subtitle: "单张校对 · 左原图右字段" },
  ocrSettings:   { title: "OCR 设置",  subtitle: "识别引擎 · 云端接入 · 参数" },
  boqImport:     { title: "清单拆表",  subtitle: "上传 → 确认 → 拆表结果" },
  boqList:       { title: "工程量清单管理", subtitle: "分部 · 工种 · 分项 · 三量" },
  factor:        { title: "开票因子推算 · 税额计算", subtitle: "因子推断数量 · 价税分离 · 人民币大写" },
  delivery:      { title: "送货单整理", subtitle: "识别中心 · 上传 · OCR · 分区归档" },
  quantity:      { title: "工程量管理", subtitle: "楼层 × 户号 × 分项 · 按月着色" },
  quantityUnit:  { title: "户详情", subtitle: "房间级三量 · 完成勾选 · 验收照片" },
  detail:        { title: "施工明细",  subtitle: "楼层 × 工种 明细" },
  payroll:       { title: "工资核算",  subtitle: "班组 × 项目 × 月份" },
  payrollDetail: { title: "工资明细",  subtitle: "分项工程量 · 计算流程" },
  wageSlip:      { title: "工资进度款工具", subtitle: "户工程量配置 · 汇总 · 明细 · 考勤 · 空鼓扣罚" },
  price:         { title: "单价对比",  subtitle: "材料价格分析" },
};

class Component extends DCLogic {
  state = {
    route: "home",
    params: {},
    tabs: [{ id: "home", route: "home", params: {}, title: "首页" }],
    activeId: "home",
    collapsed: false,
    groupOpen: { "g-project": true, "g-base": false, "g-ocr": true, "g-finance": true, "g-sub": true, "g-material": false },
  };

  _tabSeq = 0;

  // 页签去重 key：同 route + 相同关键参数 → 同一页签
  _tabKey(route, params) {
    const p = params || {};
    if (route === "projectDetail" || route === "supplierDetail" || route === "workerDetail" || route === "invoiceEdit")
      return route + ":" + (p.id || "");
    if (route === "boqImport" || route === "boqList") return route + ":" + (p.contract || "");
    if (route === "crewDetail") return route + ":" + (p.crewId || "");
    if (route === "payrollDetail") return route + ":" + (p.worker || "") + ":" + (p.crew || "") + ":" + (p.project || "");
    if (route === "quantityUnit") return route + ":" + (p.building || "") + ":" + (p.floor || "") + ":" + (p.unit || "");
    return route; // 列表类页面：一个 route 一个页签
  }

  // 页签标题 = PAGE.title + 对象名后缀（best-effort 从 KIT_DATA 查）
  _tabTitle(route, params) {
    const page = PAGE[route] || PAGE.home;
    const p = params || {};
    const d = window.KIT_DATA || {};
    let name = "";
    try {
      if (route === "projectDetail") name = ((d.projects || []).find(x => x.id === p.id) || {}).name || "";
      else if (route === "supplierDetail") {
        const s = (d.suppliers || []).find(x => x.id === p.id);
        name = s ? ((s.aliases && s.aliases[0]) || s.name) : "";
      }
      else if (route === "workerDetail") name = ((d.workers || []).find(x => x.id === p.id) || {}).name || "";
      else if (route === "crewDetail") name = ((d.crews || []).find(x => x.id === p.crewId) || {}).name || "";
      else if (route === "payrollDetail") name = p.worker || "";
      else if (route === "quantityUnit") name = (p.building ? p.building + "·" : "") + (p.floor || "") + (p.unit || "");
      else if (route === "invoiceEdit") { const iv = (window.INV && window.INV.get(p.id)); name = iv && iv.number ? iv.number.slice(-8) : ""; }
      else if (route === "boqImport" || route === "boqList") name = (p.contract || "").slice(0, 10);
    } catch (e) { name = ""; }
    return name ? page.title + "·" + name : page.title;
  }

  navigate = (route, params) => {
    const p = params || {};
    const key = this._tabKey(route, p);
    const title = this._tabTitle(route, p);
    const tabs = this.state.tabs.slice();
    const existIdx = tabs.findIndex(t => this._tabKey(t.route, t.params) === key);
    if (existIdx > -1) {
      const t = tabs[existIdx];
      tabs[existIdx] = { ...t, params: p, title };
      this.setState({ route, params: p, tabs, activeId: t.id });
      return;
    }
    if (tabs.filter(t => t.id !== "home").length >= 10) {   // 上限 10（不含首页）：阻断提示，不自动关（CONTEXT.md 页签导航）
      const K = window.KitUI || {};
      try {
        K.confirm({ title: "页签已达上限（10 个）", message: "请先关闭部分页签，或一键关闭全部后再打开新页面。",
          okText: "关闭全部页签", confirmText: "关闭全部页签", onConfirm: () => this.closeTabs("all") });
      } catch (e) { if (K.toast) K.toast("页签已达上限（10 个），请先关闭部分页签", "warn"); }
      return;
    }
    const id = "t" + (++this._tabSeq);
    tabs.push({ id, route, params: p, title });
    this.setState({ route, params: p, tabs, activeId: id });
  };

  activateTab = (id) => {
    const t = this.state.tabs.find(x => x.id === id);
    if (t) this.setState({ activeId: id, route: t.route, params: t.params });
  };

  closeTab = (id) => {
    const s = this.state;
    const idx = s.tabs.findIndex(t => t.id === id);
    if (idx === -1 || s.tabs[idx].id === "home") return; // 首页页签不可关
    const tabs = s.tabs.slice();
    tabs.splice(idx, 1);
    if (s.activeId === id) {                    // 关闭激活页签 → 激活其左侧相邻
      const next = tabs[Math.max(0, idx - 1)] || tabs[0];
      this.setState({ tabs, activeId: next.id, route: next.route, params: next.params });
    } else {
      this.setState({ tabs });
    }
  };

  // 批量关闭：all=关闭全部 / others=关闭其他 / right=关闭右侧（均保留首页）
  closeTabs = (mode, anchorId) => {
    const s = this.state;
    const ai = s.tabs.findIndex(t => t.id === anchorId);
    const keep = s.tabs.filter((t, i) => {
      if (t.id === "home") return true;
      if (mode === "others") return t.id === anchorId;
      if (mode === "right") return i <= ai;
      return false;                                        // all
    });
    const active = keep.find(t => t.id === (mode === "all" ? "home" : (anchorId || s.activeId))) || keep[0];
    this.setState({ tabs: keep, tabMenu: null, activeId: active.id, route: active.route, params: active.params });
  };

  _buildTabbar() {
    const { tabs, activeId, tabMenu } = this.state;
    const menuItem = (label, fn, disabled) => React.createElement("button", {
      key: label, type: "button", disabled: !!disabled,
      onClick: () => { if (!disabled) fn(); this.setState({ tabMenu: null }); },
      style: { display: "block", width: "100%", textAlign: "left", border: 0, background: "transparent",
        padding: "7px 14px", fontSize: 13, cursor: disabled ? "not-allowed" : "pointer",
        color: disabled ? "var(--ink-faint)" : "var(--ink)", borderRadius: 6 },
      onMouseEnter: (e) => { if (!disabled) e.currentTarget.style.background = "var(--brand-soft)"; },
      onMouseLeave: (e) => { e.currentTarget.style.background = "transparent"; }
    }, label);
    return React.createElement(React.Fragment, null,
      React.createElement("div", { className: "dc-tabbar", role: "tablist" },
        ...tabs.map(t => React.createElement("div", {
          key: t.id, role: "tab", title: t.title + "（右键更多操作）",
          className: "dc-tab" + (t.id === activeId ? " active" : ""),
          onClick: () => this.activateTab(t.id),
          onContextMenu: (e) => { e.preventDefault(); this.setState({ tabMenu: { x: e.clientX, y: e.clientY, id: t.id } }); }
        },
          React.createElement("span", { className: "dc-tab-title" }, t.title),
          t.id !== "home" ? React.createElement("button", {
            type: "button", className: "dc-tab-x", title: "关闭页签",
            onClick: (e) => { e.stopPropagation(); this.closeTab(t.id); }
          }, "×") : null
        ))
      ),
      tabMenu ? React.createElement("div", { onClick: () => this.setState({ tabMenu: null }),
        onContextMenu: (e) => { e.preventDefault(); this.setState({ tabMenu: null }); },
        style: { position: "fixed", inset: 0, zIndex: 80 } },
        React.createElement("div", { onClick: (e) => e.stopPropagation(),
          style: { position: "fixed", left: Math.min(tabMenu.x, window.innerWidth - 170), top: tabMenu.y + 4, width: 152,
            background: "var(--panel)", border: "1px solid var(--line-strong)", borderRadius: 10,
            boxShadow: "var(--shadow-pop)", padding: 6, zIndex: 81 } },
          menuItem("关闭当前", () => this.closeTab(tabMenu.id), tabMenu.id === "home"),
          menuItem("关闭其他", () => this.closeTabs("others", tabMenu.id)),
          menuItem("关闭右侧", () => this.closeTabs("right", tabMenu.id)),

  _isActive(key) {
    const r = this.state.route;
    if (key === "payroll") return r === "payroll" || r === "payrollDetail";
    if (key === "quantity") return r === "quantity" || r === "detail" || r === "quantityUnit";
    if (key === "crew") return r === "crew" || r === "crewDetail";
    if (key === "supplier") return r === "supplier" || r === "supplierDetail";
    if (key === "worker") return r === "worker" || r === "workerDetail";
    if (key === "project") return r === "project" || r === "projectDetail";
    if (key === "invoice") return r === "invoice";
    if (key === "schedule") return r === "schedule" || r === "scheduleGroupNew";
    if (key === "invoiceLedger") return r === "invoiceLedger" || r === "invoiceEdit";
    if (key === "boqList") return r === "boqList" || r === "boqImport";
    return r === key;
  }

  componentDidMount() {

    window.DC = { navigate: this.navigate, closeActiveTab: () => this.closeTab(this.state.activeId) };
    if (!window.DesignSystem_e3d871) {
      const t = setInterval(() => { if (window.DesignSystem_e3d871) { clearInterval(t); this.forceUpdate(); } }, 50);
    }
    if (!window.KIT_DATA) {
      const t = setInterval(() => { if (window.KIT_DATA) { clearInterval(t); this.forceUpdate(); } }, 50);
    }
  }

  renderVals() {
    const { route, params, collapsed } = this.state;
    const page = PAGE[route] || PAGE.home;
    return {
      sidebar:         this._buildSidebar(),
      tabbar:          this._buildTabbar(),

      pageTitle:       page.title,
