    if (inv.status === "dup") return { tone: "danger", text: "重复已排除" };
    if (inv.review) return { tone: "warn", text: "待人工校对" };
    if (inv.status === "done") return { tone: "ok", text: "识别完成" };
    return { tone: "neutral", text: "待识别" };
  }
  const money = (v) => (v ? "¥" + Number(v).toLocaleString("zh-CN", { minimumFractionDigits: 2 }) : "待补");

  // 缩略图占位：无真实扫描件时显示单字方块（与原应用一致）
  function Thumb({ w = 28, h = 36, char = "票" }) {
    return (
      <span style={{ width: w, height: h, borderRadius: 4, border: "1px solid var(--line)", background: "var(--surface-3)", display: "grid", placeItems: "center", flex: "none", overflow: "hidden" }}>
        <span style={{ color: "var(--brand)", fontSize: 11, fontWeight: 800 }}>{char}</span>
      </span>
    );
  }

  // A4 打印位：faux 扫描发票（白纸 + 抬头线 + 红章），仅作排版预览占位
  function PrintSlot({ seq, inv, selected, onClick }) {
    const st = statusOf(inv);
    return (
      <div onClick={onClick} style={{
        position: "relative", aspectRatio: "0.72", background: "#fff",
        border: selected ? "2px solid var(--brand)" : "1px solid var(--line)",
        borderRadius: 6, boxShadow: selected ? "0 0 0 2px rgba(37,99,235,.22)" : "var(--shadow-card)",
        cursor: "pointer", overflow: "hidden", padding: "14px 12px",
      }}>
        <span style={{ position: "absolute", top: 6, left: 6, background: "var(--ink)", color: "#fff", fontSize: 10, fontWeight: 700, fontFamily: "var(--font-mono)", padding: "1px 5px", borderRadius: 4 }}>{String(seq).padStart(2, "0")}</span>
        {inv.review && <span style={{ position: "absolute", top: 6, right: 6, background: "var(--warn-soft)", color: "var(--warn-ink)", fontSize: 10, fontWeight: 700, padding: "1px 6px", borderRadius: 999 }}>待复核</span>}
        <div style={{ marginTop: 14, fontSize: 9, fontWeight: 800, color: "var(--ink)", textAlign: "center", letterSpacing: ".05em" }}>{inv.type !== "—" ? inv.type : "增值税发票"}</div>
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 4 }}>
          {[70, 90, 55, 80].map((wd, i) => <div key={i} style={{ height: 3, width: wd + "%", background: "var(--surface-3)", borderRadius: 2 }} />)}
        </div>
        <div style={{ marginTop: 10, fontFamily: "var(--font-mono)", fontSize: 8, color: "var(--ink-soft)" }}>{inv.number ? inv.number.slice(-8) : "—"}</div>
        <div style={{ marginTop: 4, fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 800, color: "var(--ink)" }}>{money(inv.total)}</div>
        <div style={{ position: "absolute", bottom: 10, right: 10, width: 34, height: 34, borderRadius: "50%", border: "1.5px solid rgba(220,38,38,.55)", display: "grid", placeItems: "center", transform: "rotate(-12deg)" }}>
          <span style={{ fontSize: 7, color: "rgba(220,38,38,.7)", fontWeight: 700, textAlign: "center", lineHeight: 1.1 }}>发票<br />专用章</span>
        </div>
      </div>
    );
  }

  function InvoiceScreen({ data }) {
    const [stage, setStage] = React.useState("status");
    const [statusFilter, setStatusFilter] = React.useState("all");
    const [buyerFilter, setBuyerFilter] = React.useState("全部");
    const [selId, setSelId] = React.useState(null);
    const [perPage, setPerPage] = React.useState(2);
    const [ppOpen, setPpOpen] = React.useState(false);
    const [moreOpen, setMoreOpen] = React.useState(false);

    const invoices = data.invoices;
    const recognized = invoices.filter((i) => i.status === "done");
    const pending = recognized.filter((i) => i.account === "pending");
    const posted = recognized.filter((i) => i.account === "posted");
    const todoCount = invoices.filter((i) => i.status === "todo").length;
    const dupCount = invoices.filter((i) => i.status === "dup").length;

    const sel = recognized.find((i) => i.id === selId) || recognized[0];

    const statusFilters = [
      { key: "all", label: "全部", count: invoices.length },
      { key: "review", label: "待人工校对", count: invoices.filter((i) => i.review).length },
      { key: "done", label: "识别完成", count: invoices.filter((i) => i.status === "done" && !i.review).length },
      { key: "todo", label: "待识别", count: todoCount },
      { key: "dup", label: "重复/历史", count: dupCount },
    ];
    const buyers = ["全部", ...Array.from(new Set(invoices.filter((i) => i.buyer).map((i) => i.buyer)))];
    const docTypes = ["全部", "增值税专用发票", "增值税普通发票"];

    const visible = invoices.filter((inv) => {
      if (statusFilter === "review") return inv.review;
      if (statusFilter === "done") return inv.status === "done" && !inv.review;
      if (statusFilter === "todo") return inv.status === "todo";
      if (statusFilter === "dup") return inv.status === "dup";
      return true;
    }).filter((inv) => buyerFilter === "全部" || inv.buyer === buyerFilter);

    const stageTabs = [
      { key: "status", label: "文档识别状态", count: invoices.length },
      { key: "review", label: "发票识别与校对", count: recognized.length },
      { key: "pending", label: "待入账", count: pending.length },
      { key: "posted", label: "已入账", count: posted.length },
    ];
    const pendingTotal = money(pending.reduce((s, i) => s + Number(i.total || 0), 0));

    function openReview(inv) { setSelId(inv.id); setStage("review"); }

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {/* sticky 阶段 tab + 操作栏 */}
        <div style={{ position: "sticky", top: "var(--header-h)", zIndex: 10, background: "var(--bg)", margin: "0 -16px", padding: "4px 16px 8px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 6, flex: 1, minWidth: 0, overflowX: "auto" }}>
              {stageTabs.map((t) => <StageTab key={t.key} label={t.label} count={t.count} active={stage === t.key} onClick={() => setStage(t.key)} />)}
            </div>
            <div style={{ display: "flex", gap: 8, position: "relative" }}>
              <Button variant="primary" icon="scan-text" disabled={!todoCount}>批量识别</Button>
              <IconButton icon="ellipsis" size={34} title="更多" onClick={() => setMoreOpen(!moreOpen)} />
              {moreOpen && (
                <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 4, minWidth: 140, background: "#fff", border: "1px solid var(--line-strong)", borderRadius: 8, boxShadow: "var(--shadow-pop)", padding: 4, zIndex: 20 }} onClick={() => setMoreOpen(false)}>
                  <button style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "6px 10px", fontSize: 13, border: 0, background: "transparent", borderRadius: 6, textAlign: "left", color: "var(--ink)" }}>
                    <Icon name="trash-2" size={16} color="var(--danger)" />清空列表
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>

        {stage === "status" && (
          <StatusStage {...{ invoices, todoCount, pending, posted, statusFilters, statusFilter, setStatusFilter, buyers, buyerFilter, setBuyerFilter, docTypes, visible, statusOf, openReview, Thumb, setStage }} />
        )}
        {stage === "review" && (
          <ReviewStage {...{ recognized, pending, sel, setSelId, statusOf, perPage, setPerPage, ppOpen, setPpOpen, money, Thumb, PrintSlot }} />
        )}
        {stage === "pending" && <PendingStage {...{ pending, pendingTotal, statusOf, money, Thumb }} />}
        {stage === "posted" && <PostedStage {...{ posted, money, Thumb }} />}
      </div>
    );
  }

  // ——— 状态阶段 ———
  function StatusStage(p) {
    const { invoices, todoCount, pending, posted, statusFilters, statusFilter, setStatusFilter, buyers, buyerFilter, setBuyerFilter, docTypes, visible, statusOf, openReview, Thumb, setStage } = p;
    const th = { padding: "12px 16px", fontSize: 12, fontWeight: 800, color: "var(--ink-soft)", letterSpacing: ".02em", textAlign: "left" };
    const td = { padding: "12px 16px", fontSize: 13, verticalAlign: "middle" };
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16 }}>
          <StatCard label="全部" value={invoices.length} />
          <StatCard label="待识别" value={todoCount} tone="warn" />
          <StatCard label="待入账" value={pending.length} tone="ok" clickable onClick={() => setStage("pending")} />
          <StatCard label="已入账" value={posted.length} tone="ok" clickable onClick={() => setStage("posted")} />
        </div>

        {/* 紧凑上传区 */}
        <div style={{ border: "1.5px dashed var(--line-strong)", borderRadius: 12, background: "var(--panel)", padding: "18px 20px", display: "flex", alignItems: "center", gap: 14, color: "var(--ink-soft)" }}>
          <Icon name="upload" size={22} color="var(--brand)" />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, color: "var(--ink)" }}>拖拽 PDF / 图片 / 文件夹到此处上传</div>
            <div style={{ fontSize: 12 }}>或点击选择文件，上传后进入文档识别状态</div>
          </div>
          <Button icon="folder-open">选择文件夹</Button>
        </div>

        <Panel padding={0} style={{ overflow: "hidden" }}>
          {/* 搜索 + 筛选 */}
          <div style={{ padding: 16, borderBottom: "1px solid var(--line)", background: "var(--surface-2)", display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ position: "relative", width: 260 }}>
              <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={14} color="var(--ink-faint)" /></span>
              <input placeholder="搜索文件名、公司…" style={{ width: "100%", border: "1px solid var(--line-strong)", borderRadius: 999, padding: "7px 12px 7px 30px", fontSize: 13, background: "#fff" }} />
            </div>
            <FilterRow label="处理状态">{statusFilters.map((s) => <FilterPill key={s.key} label={s.label} count={s.count} active={statusFilter === s.key} onClick={() => setStatusFilter(s.key)} />)}</FilterRow>
            <FilterRow label="购买方">{buyers.map((b) => <FilterPill key={b} label={b === "全部" ? "全部" : b.replace("广州市", "").slice(0, 8)} active={buyerFilter === b} onClick={() => setBuyerFilter(b)} />)}</FilterRow>
            <FilterRow label="票据类型">{docTypes.map((t) => <FilterPill key={t} label={t} active={t === "全部"} />)}</FilterRow>
          </div>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", minWidth: 880, borderCollapse: "collapse" }}>
              <thead style={{ background: "var(--surface-2)" }}>
                <tr style={{ borderBottom: "1px solid var(--line)" }}>
                  <th style={th}>#</th><th style={th}>文件名</th><th style={th}>类型</th><th style={th}>序号</th><th style={th}>大小/页数</th><th style={th}>状态</th><th style={{ ...th, textAlign: "right" }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {visible.map((inv, i) => {
                  const st = statusOf(inv);
                  return (
                    <tr key={inv.id} style={{ borderBottom: "1px solid var(--line)", cursor: "pointer" }} onClick={() => openReview(inv)}>
                      <td style={{ ...td, color: "var(--ink-soft)" }}>{i + 1}</td>
                      <td style={td}><div style={{ fontWeight: 700, maxWidth: 240, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inv.name}</div></td>
                      <td style={{ ...td, color: "var(--ink-soft)" }}>{inv.type}</td>
                      <td style={{ ...td, fontFamily: "var(--font-mono)", color: "var(--ink-soft)" }}>{String(i + 1).padStart(2, "0")}</td>
                      <td style={{ ...td, color: "var(--ink-soft)" }}>{inv.size} / {inv.pages} 页</td>
                      <td style={td}><StatusChip tone={st.tone}>{st.text}</StatusChip></td>
                      <td style={{ ...td, textAlign: "right", whiteSpace: "nowrap" }}>
                        <span style={{ display: "inline-flex", gap: 6 }} onClick={(e) => e.stopPropagation()}>
                          <IconButton icon="file-search" title="查看校对" onClick={() => openReview(inv)} />
                          <IconButton icon="trash-2" tone="danger" title="删除" />
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ padding: "12px 16px", borderTop: "1px solid var(--line)", background: "var(--surface-2)", display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--ink-soft)" }}>
            <span>显示 {visible.length} 个文档，共 {invoices.length} 个</span>
            <span><StatusChip tone="danger">{invoices.filter((i) => i.status === "dup").length} 张重复</StatusChip></span>
          </div>
        </Panel>
      </div>
    );
  }

  function FilterRow({ label, children }) {
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", width: 56, flex: "none" }}>{label}</span>
        {children}
      </div>
    );
  }

  // ——— 校对阶段（三栏） ———
  function ReviewStage(p) {
    const { recognized, pending, sel, setSelId, statusOf, perPage, setPerPage, ppOpen, setPpOpen, money, Thumb, PrintSlot } = p;
    const cols = perPage === 1 ? 1 : 2;
    return (
      <div style={{ display: "grid", gridTemplateColumns: "300px minmax(360px,1fr) minmax(380px,.95fr)", gap: 16, height: "calc(100vh - 200px)", minHeight: 560 }}>
        {/* 左：列表 */}
        <Panel padding={0} style={{ overflow: "hidden", display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--line)", background: "var(--surface-2)", fontSize: 12, color: "var(--ink-soft)", fontWeight: 700 }}>
            本批次 {recognized.length} 张 · <b style={{ color: "var(--brand)" }}>待入账 {pending.length}</b>
          </div>
          <div style={{ overflowY: "auto" }}>
            {recognized.map((inv) => {
              const st = statusOf(inv);
              const on = sel && sel.id === inv.id;
              return (
                <button key={inv.id} onClick={() => setSelId(inv.id)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 12px", border: 0, borderBottom: "1px solid var(--line)", background: on ? "var(--brand-soft)" : "transparent", textAlign: "left", cursor: "pointer" }}>
                  <Thumb />
                  <span style={{ minWidth: 0, flex: 1 }}>
                    <span style={{ display: "block", fontSize: 13, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inv.number ? inv.number.slice(-8) : inv.name}</span>
                    <span style={{ display: "block", fontSize: 12, color: "var(--ink-soft)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inv.seller || inv.buyer}</span>
                  </span>
                  <StatusChip tone={st.tone}>{st.text}</StatusChip>
                </button>
              );
            })}
          </div>
        </Panel>

        {/* 中：A4 打印排版 */}
        <Panel padding={0} style={{ overflow: "hidden", display: "flex", flexDirection: "column", background: "var(--surface-sink)" }}>
          <div style={{ position: "sticky", top: 0, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px", background: "var(--surface-sink)", borderBottom: "1px solid var(--line)" }}>
            <div><div style={{ fontSize: 13, fontWeight: 800 }}>打印排版</div><div style={{ fontSize: 11, color: "var(--ink-soft)" }}>单击选中 · 双击放大 · 右键旋转</div></div>
            <div style={{ position: "relative" }}>
              <Button size="sm" iconRight="chevron-down" onClick={() => setPpOpen(!ppOpen)}>{perPage} 张/页</Button>
              {ppOpen && (
                <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 4, background: "#fff", border: "1px solid var(--line-strong)", borderRadius: 8, boxShadow: "var(--shadow-pop)", padding: 4, zIndex: 5 }} onClick={() => setPpOpen(false)}>
                  {[1, 2, 4].map((n) => <button key={n} onClick={() => setPerPage(n)} style={{ display: "block", width: 90, padding: "6px 10px", fontSize: 13, border: 0, background: n === perPage ? "var(--brand-soft)" : "transparent", color: n === perPage ? "var(--brand)" : "var(--ink)", borderRadius: 6, textAlign: "left", cursor: "pointer" }}>{n} 张/页</button>)}
                </div>
              )}
            </div>
          </div>
          <div style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 14 }}>
            {[0, 1].map((page) => (
              <div key={page} style={{ background: "#fff", border: "1px solid var(--line)", borderRadius: 8, boxShadow: "var(--shadow-card)", aspectRatio: "1/1.414", padding: 16, display: "grid", gridTemplateColumns: `repeat(${cols},1fr)`, gridAutoRows: "min-content", gap: 14, alignContent: "start" }}>
                {recognized.slice(page * perPage, page * perPage + perPage).map((inv, idx) => (
                  <PrintSlot key={inv.id} seq={page * perPage + idx + 1} inv={inv} selected={sel && sel.id === inv.id} onClick={() => setSelId(inv.id)} />
                ))}
              </div>
            ))}
          </div>
        </Panel>

        {/* 右：校对表单 */}
        {sel ? <ReviewForm sel={sel} statusOf={statusOf} /> : <Panel style={{ display: "grid", placeItems: "center", color: "var(--ink-soft)" }}>选择一张发票开始校对。</Panel>}
      </div>
    );
  }

  function ReviewForm({ sel, statusOf }) {
    const st = statusOf(sel);
    const [f, setF] = React.useState(sel);
    React.useEffect(() => setF(sel), [sel.id]);
    const upd = (k) => (e) => setF({ ...f, [k]: e.target.value });
    return (
      <Panel style={{ display: "flex", flexDirection: "column", gap: 16, overflowY: "auto" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <h2 style={{ margin: 0, fontSize: 16, fontWeight: 800 }}>识别结果提取</h2>
          <div style={{ display: "flex", gap: 8 }}>
            <StatusChip tone={st.tone}>{st.text}</StatusChip>
            {sel.account === "posted" && <StatusChip tone="ok">已入账</StatusChip>}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <Field label="单据编号" mono value={f.number} onChange={upd("number")} />
          <Field label="开票日期" mono value={f.date} onChange={upd("date")} placeholder="2026-06-15" />
          <Field label="购买方" value={f.buyer} onChange={upd("buyer")} />
          <Field label="供应商" value={f.seller} onChange={upd("seller")} />
          <Field label="票据类型" value={f.type} onChange={upd("type")} />
          <Field label="金额" mono value={f.total} onChange={upd("total")} />
          <Field label="对应项目" colSpan={2} value={f.project} onChange={upd("project")} />
          <Field label="税额" mono value={f.tax} onChange={upd("tax")} />
          <Field label="税点" mono value={f.rate} onChange={upd("rate")} />
          <Field label="票面备注" colSpan={2} value={f.remark} onChange={upd("remark")} placeholder="发票备注栏内容" />
        </div>
        <div style={{ marginTop: "auto", paddingTop: 12, borderTop: "1px solid var(--line)", display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <Button variant="danger">废弃该单据</Button>
          <div style={{ display: "flex", gap: 8 }}>
            <Button>重新识别</Button>
            {sel.account === "posted" ? <Button>移回待入账</Button> : <Button variant="primary">确认并入账</Button>}
          </div>
        </div>
      </Panel>
    );
  }

  // ——— 待入账阶段 ———
  function PendingStage({ pending, pendingTotal, statusOf, money, Thumb }) {
    const th = { padding: "12px 16px", fontSize: 12, fontWeight: 800, color: "var(--ink-soft)", textAlign: "left" };
    const td = { padding: "12px 16px", fontSize: 13 };
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ color: "var(--ink-soft)" }}>合计 <span style={{ color: "var(--ink)", fontSize: 18, fontWeight: 800, fontFamily: "var(--font-mono)" }}>{pendingTotal}</span></div>
          <Button variant="primary" icon="file-check">批量入账</Button>
        </div>
        <Panel padding={0} style={{ overflow: "hidden" }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", minWidth: 1080, borderCollapse: "collapse" }}>
              <thead style={{ background: "var(--surface-2)" }}><tr style={{ borderBottom: "1px solid var(--line)" }}>
                {["缩略", "单据编号", "开票日期", "购买方", "供应商", "类型", "金额", "对应项目", "操作"].map((h, i) => <th key={i} style={{ ...th, textAlign: i === 6 || i === 8 ? "right" : "left" }}>{h}</th>)}
              </tr></thead>
              <tbody>
                {pending.map((inv) => (
                  <tr key={inv.id} style={{ borderBottom: "1px solid var(--line)" }}>
                    <td style={td}><Thumb w={40} h={52} /></td>
                    <td style={{ ...td, fontFamily: "var(--font-mono)", fontWeight: 700 }}>{inv.number.slice(-8)}</td>
                    <td style={{ ...td, fontFamily: "var(--font-mono)", color: "var(--ink-soft)" }}>{inv.date}</td>
                    <td style={{ ...td, maxWidth: 180, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inv.buyer}</td>
                    <td style={{ ...td, maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inv.seller}</td>
                    <td style={td}>{inv.type}</td>
                    <td style={{ ...td, textAlign: "right", fontFamily: "var(--font-mono)", fontWeight: 800 }}>{money(inv.total)}</td>
                    <td style={{ ...td, color: "var(--ink-soft)" }}>{inv.project}</td>
                    <td style={{ ...td, textAlign: "right", whiteSpace: "nowrap" }}>
                      <span style={{ display: "inline-flex", gap: 6 }}>
                        <IconButton icon="square-pen" title="编辑" />
                        <IconButton icon="file-check" title="入账" />
                        <IconButton icon="trash-2" tone="danger" title="删除" />
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Panel>
      </div>
    );
  }

  // ——— 已入账阶段 ———
  function PostedStage({ posted, money, Thumb }) {
    const th = { padding: "12px 16px", fontSize: 12, fontWeight: 800, color: "var(--ink-soft)", textAlign: "left" };
    const td = { padding: "12px 16px", fontSize: 13 };
    return (
      <Panel padding={0} style={{ overflow: "hidden" }}>
        <div style={{ overflowX: "auto" }}>

    return (

            <div style={{ fontWeight: 700, color: "var(--ink)" }}>拖拽工地文件夹到此处</div>

})();

// ── kit/PayrollScreen.jsx ──
// PayrollScreen — 工资管理三层钻取：项目 → 班组 → 工资总表（含矩阵 Tab）
(function () {
  const { Button, Panel, StatusChip, StatCard, StageTab, Icon } = window.DesignSystem_e3d871;
  const yuan = n => "¥" + Math.round(n).toLocaleString("zh-CN");

  function PayrollScreen({ data, navigate }) {
    // 内部三层状态
    const [selProject, setSelProject] = React.useState(null);
    const [selCrew, setSelCrew] = React.useState(null);
    const [tab, setTab] = React.useState("table");

    const back = () => { if (selCrew) setSelCrew(null); else setSelProject(null); };

    // ── Level 0: 项目卡片 ──
    if (!selProject) return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>选择项目 → 查看班组 → 进入工资总表</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 12 }}>
          {data.projects.map(p => {
            const crews = data.projectCrews[p.name] || [];
            const total = crews.reduce((s, c) => s + c.net, 0);
            const hasAny = crews.some(c => c.hasData);
            return (
              <button key={p.id} onClick={() => { setSelProject(p.name); setSelCrew(null); }}
                style={{ border: "1px solid var(--line)", borderRadius: 12, padding: 0, background: "var(--panel)", cursor: "pointer", textAlign: "left" }}
                onMouseEnter={e => e.currentTarget.style.boxShadow="var(--shadow-pop)"}
                onMouseLeave={e => e.currentTarget.style.boxShadow="none"}>
                <div style={{ padding: "16px 18px 12px" }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ fontSize: 16, fontWeight: 800 }}>{p.name}</div>
                    <StatusChip tone={p.status==="在建"?"ok":p.status==="收尾"?"warn":"neutral"}>{p.status}</StatusChip>
                  </div>
                  <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 4 }}>{p.address}</div>
                </div>
                <div style={{ padding: "10px 18px 14px", borderTop: "1px solid var(--line)", display: "flex", gap: 20 }}>
                  <div><div style={{ fontSize: 11, color:"var(--ink-faint)" }}>参与班组</div><div style={{ fontSize: 16, fontWeight: 800, marginTop: 2 }}>{crews.length}</div></div>
                  <div><div style={{ fontSize: 11, color:"var(--ink-faint)" }}>本期实发</div><div style={{ fontSize: 16, fontWeight: 800, marginTop: 2, color: hasAny?"var(--brand)":"var(--ink-faint)" }}>{hasAny ? yuan(total) : "—"}</div></div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    );

    // ── Level 1: 班组列表 ──
    const crews = data.projectCrews[selProject] || [];
    if (!selCrew) return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Breadcrumb items={[{label:"工资管理",onClick:back},{label:selProject}]} />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 12 }}>
          {crews.map((c, i) => (
            <button key={i} onClick={() => { if (c.hasData) setSelCrew(c.crew); }}
              style={{ border: "1px solid var(--line)", borderRadius: 12, padding: "16px 18px", background: "var(--panel)", cursor: c.hasData?"pointer":"not-allowed", textAlign: "left", opacity: c.hasData?1:0.55 }}
              onMouseEnter={e => c.hasData && (e.currentTarget.style.boxShadow="var(--shadow-pop)")}
              onMouseLeave={e => e.currentTarget.style.boxShadow="none"}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <span style={{ width:36,height:36,borderRadius:9,background:"var(--brand-soft)",color:"var(--brand)",fontWeight:800,display:"grid",placeItems:"center" }}>{c.crew.slice(0,1)}</span>
                <div><div style={{ fontSize:15,fontWeight:800 }}>{c.crew}</div><div style={{ fontSize:12,color:"var(--ink-soft)" }}>{c.trade} · {c.workers}人</div></div>
              </div>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"baseline" }}>
                <span style={{ fontSize:12,color:"var(--ink-soft)" }}>本期实发</span>
                <span style={{ fontSize:18,fontWeight:800,fontFamily:"var(--font-mono)",color:c.hasData?"var(--brand)":"var(--ink-faint)" }}>{c.hasData ? yuan(c.net) : "暂无数据"}</span>
              </div>
            </button>
          ))}
        </div>
      </div>
    );

    const p = data.payroll;

      const gross=r.engineering+r.rent+r.mgmt;

                  <div style={{ fontSize:11,marginTop:4,color:s.current?"var(--brand)":"var(--ink-soft)",fontWeight:s.current?800:600 }}>{s.m}</div>
                </div>
                {i < p.ratioSchedule.length-1 && <div style={{ flex:1,height:2,background:"var(--line)",marginBottom:18 }}></div>}
              </React.Fragment>
            ))}
          </div>
        </Panel>

        {/* Tab 切换 */}
        <div style={{ display:"flex",gap:8 }}>
          <StageTab label="工资总表" active={tab==="table"} onClick={() => setTab("table")} />
          <StageTab label="工程量矩阵" active={tab==="matrix"} onClick={() => setTab("matrix")} />
        </div>

        {tab === "table" && (
          <Panel padding={8}>
            <div style={{ overflow:"auto",maxHeight:440 }}>
              <table style={{ width:"100%",minWidth:920,borderCollapse:"collapse" }}>
                <thead><tr>

// CalcScreen — 开票因子推算 + 税额计算/大写
(function () {
  const { Button, Panel, Icon, StatusChip } = window.DesignSystem_e3d871;

  function moneyToChinese(amount) {
    if (!amount && amount !== 0) return "";
    const digit = ["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"];
    const intUnit = ["","拾","佰","仟"];
    const bigUnit = ["","万","亿"];
    const neg = amount < 0;
    let total = Math.round(Math.abs(amount) * 100);
    const fen = total % 10, jiao = Math.floor(total / 10) % 10;
    let intPart = Math.floor(total / 100), intStr = "";
    if (intPart === 0) { intStr = "零"; } else {
      const groups = [];
      while (intPart > 0) { groups.push(intPart % 10000); intPart = Math.floor(intPart / 10000); }
      for (let gi = groups.length - 1; gi >= 0; gi--) {
        const g = groups[gi];
        const arr = [g%10,Math.floor(g/10)%10,Math.floor(g/100)%10,Math.floor(g/1000)%10];
        let gstr="",started=false,zeroPending=false;
        for (let pos=3;pos>=0;pos--) {
          const dd=arr[pos];
          if(dd===0){if(started)zeroPending=true;}
          else{if(zeroPending){gstr+="零";zeroPending=false;}gstr+=digit[dd]+intUnit[pos];started=true;}
        }
        if(gstr)intStr+=gstr+bigUnit[gi];else if(intStr&&gi>0)intStr+="零";
      }
    }
    intStr=intStr.replace(/零+/g,"零").replace(/零+$/,"");
    let result=intStr+"元";
    if(!jiao&&!fen){result+="整";}
    else{if(jiao)result+=digit[jiao]+"角";else if(fen)result+="零";if(fen)result+=digit[fen]+"分";else result+="整";}
    return (neg?"负":"")+result;
  }

  function useCopy(val) {
    const [copied, setCopied] = React.useState(false);
    const copy = () => {
      const txt = String(val);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
      else { const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t); }
      setCopied(true); setTimeout(()=>setCopied(false),1400);
    };
    return [copied, copy];
  }

  // 可点击复制的数值块
  function CopyValue({ value, display, mono, large, color }) {
    const [copied, copy] = useCopy(value);
    return (
      <span onClick={copy} title="点击复制"
        style={{ cursor:"pointer", display:"inline-flex", alignItems:"center", gap:5,
          fontFamily: mono?"var(--font-mono)":"inherit",
          fontSize: large?22:14, fontWeight:700,
          color: copied?"var(--ok)": color||"var(--ink)",
          background: copied?"var(--ok-soft,#f0fdf4)":"transparent",
          borderRadius:4, padding:"1px 4px", transition:"background 0.2s" }}>
        {copied ? <Icon name="check" size={13} /> : <Icon name="copy" size={13} color="var(--ink-faint)" />}
        {display || value}
      </span>
    );
  }

  function CalcScreen({ data }) {
    const [factors, setFactors] = React.useState(data.factorDefaults.map(f=>({...f})));
    const [target, setTarget] = React.useState("128640");
    const [taxRate, setTaxRate] = React.useState("13");
    const [results, setResults] = React.useState(null);
    const [nextId, setNextId] = React.useState(100);

    const t = parseFloat(target)||0;
    const r = (parseFloat(taxRate)||0)/100;
    const exTax = t>0 ? t/(1+r) : 0;
    const taxAmt = t-exTax;

    const addRow = () => { setFactors(f=>[...f,{id:"n"+nextId,name:"",unit:"个",price:""}]); setNextId(n=>n+1); };
    const removeRow = id => setFactors(f=>f.filter(x=>x.id!==id));
    const updateRow = (id,field,val) => setFactors(f=>f.map(x=>x.id===id?{...x,[field]:val}:x));

    const calculate = () => {
      if (t <= 0) return;
      const rows = factors.filter(f=>f.name&&parseFloat(f.price)>0).map(f=>{
        const p = parseFloat(f.price);
        const qtyExact = t/p;
        const qtyFloor = Math.floor(qtyExact);
        const qtyCeil = Math.ceil(qtyExact);
        const isInt = Math.abs(qtyExact-Math.round(qtyExact))<1e-9;
        return { ...f, p, qtyExact, qtyFloor, qtyCeil, isInt,
          qtyBest: isInt?Math.round(qtyExact):null,
          amtFloor: qtyFloor*p, amtCeil: qtyCeil*p };
      });
      setResults(rows);
    };

    const inp = {border:"1px solid var(--line-strong)",borderRadius:7,padding:"7px 10px",fontSize:13,fontFamily:"var(--font-mono)",background:"#fff",width:"100%"};
    const th = {padding:"9px 12px",fontSize:12,fontWeight:800,color:"var(--ink-soft)",background:"var(--surface-2)",position:"sticky",top:0,whiteSpace:"nowrap"};
    const td = {padding:"9px 12px",fontSize:13};
    const num = {...td,textAlign:"right",fontFamily:"var(--font-mono)"};

    const fmt = v => v.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});

    return (
      <div style={{display:"grid",gridTemplateColumns:"320px 1fr",gap:12,alignItems:"start"}}>

        {/* ── 左列 ── */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>

          {/* 税额计算 */}
          <Panel padding={16} style={{display:"flex",flexDirection:"column",gap:14}}>
            <div style={{fontSize:13,fontWeight:800,color:"var(--ink-soft)",marginBottom:-6}}>税额计算</div>

            <div>
              <div style={{fontSize:12,color:"var(--ink-soft)",marginBottom:5}}>目标含税金额（元）</div>
              <input style={{...inp,fontSize:17,fontWeight:700,padding:"10px 12px"}} value={target}
                onChange={e=>setTarget(e.target.value)} placeholder="如 128640.00" />
            </div>

            <div>
              <div style={{fontSize:12,color:"var(--ink-soft)",marginBottom:5}}>税率 (%)</div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input style={{...inp,width:80}} value={taxRate} onChange={e=>setTaxRate(e.target.value)} />
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {["13","9","6","3","1"].map(v=>(
                    <button key={v} onClick={()=>setTaxRate(v)} style={{border:"1px solid",borderColor:taxRate===v?"var(--brand)":"var(--line)",background:taxRate===v?"var(--brand-soft)":"#fff",color:taxRate===v?"var(--brand)":"var(--ink)",borderRadius:6,padding:"5px 10px",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"var(--font-mono)"}}>{v}%</button>
                  ))}
                </div>
              </div>
            </div>

            {/* 结果——点击复制 */}
            {t > 0 && (
              <div style={{display:"flex",flexDirection:"column",gap:0,borderTop:"1px solid var(--line)",paddingTop:12}}>
                {[
                  ["价税合计", t, t.toFixed(2)],
                  ["不含税金额", exTax, exTax.toFixed(2)],
                  ["税额", taxAmt, taxAmt.toFixed(2)],
                ].map(([label, val, raw]) => (
                  <div key={label} style={{padding:"8px 0",borderBottom:"1px solid var(--line)"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <span style={{fontSize:12,color:"var(--ink-soft)"}}>{label}</span>
                      <CopyValue value={raw} display={"¥"+fmt(val)} mono large color="var(--ink)" />
                    </div>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:2}}>
                      <span style={{fontSize:11,color:"var(--ink-faint)"}}>大写</span>
                      <CopyValue value={moneyToChinese(val)} display={moneyToChinese(val)} color="var(--ink-soft)" />
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Panel>

          {/* 因子列表 */}
          <Panel padding={0} style={{overflow:"hidden"}}>
            <div style={{padding:"12px 14px 8px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid var(--line)"}}>
              <span style={{fontSize:13,fontWeight:800}}>开票因子（单价）</span>
              <Button size="sm" icon="plus" onClick={addRow}>添加</Button>
            </div>
            {factors.map(f=>(
              <div key={f.id} style={{display:"grid",gridTemplateColumns:"1fr 56px 80px 28px",gap:6,alignItems:"center",padding:"7px 10px",borderBottom:"1px solid var(--line)"}}>
                <input style={{...inp,padding:"5px 8px"}} placeholder="品名" value={f.name} onChange={e=>updateRow(f.id,"name",e.target.value)} />
                <input style={{...inp,padding:"5px 6px"}} placeholder="单位" value={f.unit} onChange={e=>updateRow(f.id,"unit",e.target.value)} />
                <input style={{...inp,padding:"5px 8px",textAlign:"right"}} placeholder="单价" value={f.price} onChange={e=>updateRow(f.id,"price",e.target.value)} />
                <button onClick={()=>removeRow(f.id)} style={{border:0,background:"transparent",cursor:"pointer",color:"var(--ink-faint)",display:"grid",placeItems:"center"}}><Icon name="x" size={14}/></button>
              </div>
            ))}
            <div style={{padding:"10px 12px"}}>
              <Button variant="primary" icon="calculator" fullWidth onClick={calculate}>计算</Button>
            </div>
          </Panel>
        </div>

        {/* ── 右：结果表 ── */}
        <Panel padding={8}>
          <div style={{padding:"4px 6px 10px",fontSize:13,fontWeight:800,color:"var(--ink-soft)"}}>
            {results ? `推算结果 — 含税 ¥${t.toLocaleString("zh-CN")}` : "填写因子后点击「计算」"}
          </div>
          {results && (
            <div style={{overflow:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:560}}>
                <thead><tr>
                  {["品名","单位","单价","推算数量","开票金额","余额",""].map((h,i)=>(
                    <th key={i} style={{...th,textAlign:i>=2?"right":"left"}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {results.map(f=>(
                    <React.Fragment key={f.id}>
                      <tr style={{borderBottom:f.isInt?"2px solid var(--ok)":"1px solid var(--line)",background:f.isInt?"#f0fdf4":"transparent"}}>
                        <td style={{...td,fontWeight:600}}>{f.name}</td>
                        <td style={td}>{f.unit}</td>
                        <td style={{...num,color:"var(--ink-soft)"}}>{fmt(f.p)}</td>
                        <td style={{...num,fontWeight:700,color:f.isInt?"var(--ok)":"var(--ink)"}}>
                          {f.isInt ? f.qtyBest : f.qtyExact.toFixed(4)}
                        </td>
                        <td style={{...num}}>
                          {f.isInt ? <span style={{color:"var(--ok)",fontWeight:700}}>¥{fmt(f.qtyBest*f.p)}</span> : "—"}
                        </td>
                        <td style={{...num,color:f.isInt?"var(--ok)":"var(--danger)"}}>
                          {f.isInt ? "¥0.00" : "¥"+(t-f.amtFloor).toFixed(2)}
                        </td>
                        <td style={{...td,textAlign:"center"}}>
                          {f.isInt
                            ? <StatusChip tone="ok">✓ 整开</StatusChip>
                            : <StatusChip tone="warn">非整</StatusChip>}
                        </td>
                      </tr>
                      {!f.isInt && (
                        <tr style={{borderBottom:"1px solid var(--line)",background:"var(--surface-2)"}}>
                          <td colSpan={2} style={{padding:"5px 12px",fontSize:12,color:"var(--ink-faint)"}}>近似方案</td>
                          <td></td>
                          <td style={{padding:"5px 12px",fontSize:12,fontFamily:"var(--font-mono)",textAlign:"right"}}>{f.qtyFloor} / {f.qtyCeil}</td>
                          <td style={{padding:"5px 12px",fontSize:12,fontFamily:"var(--font-mono)",textAlign:"right",color:"var(--ink-soft)"}}>¥{fmt(f.amtFloor)} / ¥{fmt(f.amtCeil)}</td>
                          <td style={{padding:"5px 12px",fontSize:12,fontFamily:"var(--font-mono)",textAlign:"right"}}>
                            <span style={{color:"var(--danger)"}}>−{(t-f.amtFloor).toFixed(2)}</span> / <span style={{color:"var(--warn,#f59e0b)"}}>+{(f.amtCeil-t).toFixed(2)}</span>
                          </td>
                          <td></td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))}
                  {results.length===0 && (
                    <tr><td colSpan={7} style={{padding:32,textAlign:"center",color:"var(--ink-faint)"}}>没有填写有效单价的因子</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}
          {!results && (
            <div style={{padding:48,textAlign:"center",color:"var(--ink-faint)",fontSize:13}}>
              在左侧维护单价因子列表，填写目标含税金额后点击「计算」
            </div>
          )}
        </Panel>
      </div>
    );
  }
  window.CalcScreen = CalcScreen;
})();

// ── kit/AppShell.jsx ──
// AppShell — 桌面壳：左侧「分组 + 可收起」侧边栏 + 顶栏 + 主内容区。
// 改版要点（design §3.1/§12.1）：扁平 tab → 分组侧边栏；支持整体收起成图标模式，分组可折叠。
(function () {
  const { NavItem, Icon } = window.DesignSystem_e3d871;

  // 导航树：group=可折叠分组（含子项）；item=独立顶层项。
  const NAV = [
    { type: "group", key: "g-invoice", label: "发票", icon: "receipt-text", items: [
      { key: "invoice", mark: "票", label: "发票列表", hint: "识别校对入账", title: "发票管理", subtitle: "识别·校对·入账" },
      { key: "factor", mark: "因", label: "开票·税额工具", hint: "推算数量·税额大写", title: "开票因子推算 · 税额计算", subtitle: "因子推断数量 · 价税分离 · 人民币大写" },
    ] },
    { type: "item", key: "delivery", mark: "单", label: "送货单", hint: "扫描整理归档", title: "送货单", subtitle: "扫描·整理·归档" },
    { type: "item", key: "supplier", mark: "方", label: "分供方", hint: "资料管理对账", title: "分供方资料库", subtitle: "资料管理·对账" },
    { type: "group", key: "g-project", label: "项目", icon: "building", items: [
      { key: "project", mark: "项", label: "项目列表", hint: "工期进度", title: "施工项目", subtitle: "项目管理" },
      { key: "quantity", mark: "量", label: "工程量管理", hint: "矩阵可视化", title: "工程量矩阵", subtitle: "楼层×户号×分项 · 按月着色" },
    ] },
    { type: "group", key: "g-crew", label: "班组", icon: "users", items: [
      { key: "crew", mark: "组", label: "班组管理", hint: "单价·配置", title: "班组管理", subtitle: "全局核算单元 · 跨项目复用" },
      { key: "worker", mark: "工", label: "工人信息", hint: "人员证书", title: "工人信息库", subtitle: "人员管理" },
      { key: "payroll", mark: "资", label: "工资管理", hint: "核算发放", title: "工资核算", subtitle: "班组×项目×月份 · 计件 / 计时" },
    ] },
    { type: "item", key: "price", mark: "价", label: "单价对比", hint: "材料价格分析", title: "单价对比", subtitle: "材料价格分析" },
  ];

  // 扁平索引（查 active 项的标题）
  const FLAT = {};
  NAV.forEach((n) => n.type === "group" ? n.items.forEach((it) => { FLAT[it.key] = it; }) : (FLAT[n.key] = n));
  FLAT["crewDetail"] = { title: "班组详情", subtitle: "基本信息 · 工人配置 · 分项单价" };
  FLAT["payrollDetail"] = { title: "工资明细", subtitle: "分项工程量 · 计算流程" };
  window.KIT_NAV = NAV;

  function GroupHeader({ label, icon, open, onToggle, collapsed }) {
    const [hover, setHover] = React.useState(false);
    if (collapsed) return React.createElement("div", { style: { height: 1, background: "var(--line)", margin: "8px 6px" } });
    return (
      <button type="button" onClick={onToggle}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", border: 0, background: hover ? "var(--surface-3)" : "transparent", borderRadius: "var(--radius-btn)", padding: "8px 10px", marginTop: 4, cursor: "pointer", color: "var(--ink-soft)" }}>
        <Icon name={icon} size={15} />
        <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: "var(--tracking-wide)", flex: 1, textAlign: "left" }}>{label}</span>
        <Icon name={open ? "chevron-down" : "chevron-right"} size={14} />
      </button>
    );
  }

  // 图标模式下的紧凑项（仅单字方块）
  function MiniItem({ mark, label, active, onClick }) {
    const [hover, setHover] = React.useState(false);
    return (
      <button type="button" onClick={onClick} title={label}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{ display: "grid", placeItems: "center", width: 40, height: 40, margin: "2px auto", border: "1px solid",
          borderRadius: "var(--radius-btn)", cursor: "pointer", fontSize: 15, fontWeight: 800,
          background: active ? "var(--brand-soft)" : hover ? "var(--surface-3)" : "var(--surface-2)",
          borderColor: active ? "rgba(37,99,235,0.25)" : "var(--line)",
          color: active ? "var(--brand)" : "var(--ink-soft)",
          boxShadow: active ? "var(--ring-selected)" : "none" }}>
        {mark}
      </button>
    );
  }

  function AppShell({ route, onNav, onSettings, children }) {
    const [collapsed, setCollapsed] = React.useState(false);
    const [open, setOpen] = React.useState({ "g-invoice": true, "g-project": true, "g-crew": true });
    const active = FLAT[route] || NAV[0];
    const W = collapsed ? 68 : 248;

    return (
      <div style={{ minHeight: "100%", background: "var(--bg)", color: "var(--ink)" }}>
        <aside style={{ position: "fixed", insetBlock: 0, left: 0, zIndex: 30, width: W,
          background: "var(--panel)", borderRight: "1px solid var(--line)",
          display: "flex", flexDirection: "column", padding: collapsed ? "16px 8px" : "16px 12px",
          transition: "width var(--dur-base) var(--ease-snappy)" }}>

          {/* 品牌 + 收起按钮 */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: collapsed ? "0 0 16px" : "0 8px 20px", justifyContent: collapsed ? "center" : "flex-start" }}>
            <span style={{ display: "grid", placeItems: "center", width: 36, height: 36, borderRadius: 8, background: "var(--brand)", color: "#fff", fontWeight: 800, fontSize: 16, flex: "none" }}>瑞</span>
            {!collapsed && (
              <div style={{ minWidth: 0, flex: 1 }}>
                <div style={{ fontSize: 16, fontWeight: 800, lineHeight: 1.2 }}>瑞航 CRM</div>
                <div style={{ fontSize: 11, color: "var(--ink-soft)", marginTop: 2 }}>工程财务管理</div>
              </div>
            )}
          </div>

          <nav style={{ flex: 1, display: "flex", flexDirection: "column", gap: 2, overflowY: "auto", overflowX: "hidden" }}>
            {NAV.map((n) => {
              if (n.type === "item") {
                return collapsed
                  ? <MiniItem key={n.key} mark={n.mark} label={n.label} active={route === n.key} onClick={() => onNav(n.key)} />
                  : <NavItem key={n.key} mark={n.mark} label={n.label} hint={n.hint} active={route === n.key} onClick={() => onNav(n.key)} />;
              }
              if (collapsed) {
                return (
                  <React.Fragment key={n.key}>
                    <div style={{ height: 1, background: "var(--line)", margin: "8px 6px" }}></div>
                    {n.items.map((it) => <MiniItem key={it.key} mark={it.mark} label={it.label} active={route === it.key} onClick={() => onNav(it.key)} />)}
                  </React.Fragment>
                );
              }
              const isOpen = open[n.key];
              return (
                <div key={n.key}>
                  <GroupHeader label={n.label} icon={n.icon} open={isOpen} onToggle={() => setOpen((o) => ({ ...o, [n.key]: !o[n.key] }))} />
                  {isOpen && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 2, paddingLeft: 8, marginLeft: 8, borderLeft: "1px solid var(--line)" }}>
                      {n.items.map((it) => <NavItem key={it.key} mark={it.mark} label={it.label} hint={it.hint} active={route === it.key} onClick={() => onNav(it.key)} />)}
                    </div>
                  )}
                </div>
              );
            })}
          </nav>

          <button type="button" onClick={() => setCollapsed((c) => !c)}
            style={{ marginTop: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", border: "1px solid var(--line)", background: "var(--surface-2)", borderRadius: "var(--radius-btn)", padding: "8px", cursor: "pointer", color: "var(--ink-soft)", fontSize: 12, fontWeight: 700 }}>
            <Icon name={collapsed ? "panel-left-open" : "panel-left-close"} size={16} />
            {!collapsed && <span>收起侧栏</span>}
          </button>
          {!collapsed && (
            <div style={{ paddingTop: 12, marginTop: 12, borderTop: "1px solid var(--line)", fontSize: 11, color: "var(--ink-soft)", lineHeight: 1.7 }}>
              <div>本地工具 · 数据不上传</div>
              <div>v2.0 · 工程量 / 工资模块</div>
            </div>
          )}
        </aside>

        {/* 主区 */}
        <div style={{ paddingLeft: W, minHeight: "100vh", transition: "padding-left var(--dur-base) var(--ease-snappy)" }}>
          <header style={{ position: "sticky", top: 0, zIndex: 20, height: "var(--header-h)",
            background: "rgba(255,255,255,0.95)", backdropFilter: "blur(8px)",
            borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center",
            justifyContent: "space-between", gap: 16, padding: "0 24px" }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 18, fontWeight: 800, lineHeight: 1.2 }}>{active.title || active.label}</div>
              <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>{active.subtitle}</div>
            </div>
            <window.DesignSystem_e3d871.Button icon="settings" onClick={onSettings}>设置</window.DesignSystem_e3d871.Button>
          </header>
          <main style={{ maxWidth: "var(--content-max)", margin: "0 auto", padding: 16 }}>
            {children}
          </main>
        </div>
      </div>
    );
  }

  window.AppShell = AppShell;
})();



  function App() {
    const [route, setRoute] = React.useState("invoice");
    const [params, setParams] = React.useState({});
    const [settings, setSettings] = React.useState(false);
    const data = window.KIT_DATA;
    const navigate = (r, p) => { setRoute(r); setParams(p || {}); };
    const { AppShell, InvoiceScreen, SupplierScreen, ProjectScreen, WorkerScreen,
            PriceScreen, DeliveryScreen, CrewScreen, CrewDetailScreen, QuantityScreen,
            PayrollScreen, PayrollDetailScreen, CalcScreen, SettingsDialog } = window;
    const screens = {
      invoice: InvoiceScreen, delivery: DeliveryScreen, supplier: SupplierScreen,
      project: ProjectScreen, worker: WorkerScreen, price: PriceScreen,
      crew: CrewScreen, crewDetail: CrewDetailScreen,
      quantity: QuantityScreen, payroll: PayrollScreen,
      payrollDetail: PayrollDetailScreen, factor: CalcScreen,
    };
    const Screen = screens[route] || InvoiceScreen;
    return (
      <AppShell route={route} onNav={r => navigate(r)} onSettings={() => setSettings(true)}>
        <Screen key={route + JSON.stringify(params)} data={data} route={route} params={params} navigate={navigate} />
        <SettingsDialog open={settings} onClose={() => setSettings(false)} />
      </AppShell>
    );
  }
  function boot() {
    if (!window.AppShell || !window.InvoiceScreen || !window.CrewScreen ||
        !window.CrewDetailScreen || !window.QuantityScreen || !window.PayrollScreen ||
        !window.PayrollDetailScreen || !window.CalcScreen || !window.SettingsDialog ||
        !window.DesignSystem_e3d871) {
      return setTimeout(boot, 30);
    }
    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  }
  boot();
</script>
</body>
